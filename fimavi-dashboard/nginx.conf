server {
  listen 8080;

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass https://crm.fimavi.com/soeman/rest/;
    proxy_set_header Host crm.fimavi.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_ssl_server_name on;
  }
}
